buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
        maven { url "https://nexus.bertramlabs.com/content/repositories/releases" }
        maven { url "https://nexus.bertramlabs.com/content/repositories/publicReleases" }
    }
    dependencies {
        // goooler fork: johnrengelman shadow 8.1.1 does not work on Gradle 9 (same as HPE's 9.1 plugins)
        classpath "io.github.goooler.shadow:shadow-gradle-plugin:8.1.8"
        classpath "com.morpheusdata:morpheus-plugin-gradle:$morpheusGradleVersion"
        classpath "com.bertramlabs.plugins:asset-pipeline-gradle:$assetPipelineVersion"
    }
}

apply plugin: 'java'
apply plugin: 'groovy'
apply plugin: 'io.github.goooler.shadow'
apply plugin: 'asset-pipeline'
apply plugin: 'com.morpheusdata.morpheus-plugin-gradle'

group = 'com.morpheusdata.gfs2rescue'

// One source tree, one jar per Morpheus line. The default builds for 9.1 exactly as before.
// -PmorpheusTarget=9.0 builds for 9.0.x instead, which runs Plugin API 1.4.1 on Groovy 3 and an
// older JVM: the 9.1 jar (Java 25, Groovy 4) cannot load there. Every Plugin API member this plugin
// uses is the same in 1.4.1 and 1.5.0. The 9.0 build compiles with a Java 17 toolchain (downloaded
// by Gradle if none is installed) to Java 11 bytecode. It writes to build-9.0/, outside build/, so
// neither build's clean deletes the other's jar.
ext.morpheusTarget = (project.findProperty('morpheusTarget') ?: '9.1').toString()
if (!(morpheusTarget in ['9.0', '9.1'])) {
    throw new GradleException("morpheusTarget must be 9.0 or 9.1, not ${morpheusTarget}")
}
boolean for90 = morpheusTarget == '9.0'
ext.targetApiVersion = for90 ? morpheus90ApiVersion : morpheusApiVersion
ext.targetMinVersion = for90 ? min90Version : minVersion

if (for90) {
    layout.buildDirectory = layout.projectDirectory.dir('build-9.0')
    java {
        toolchain { languageVersion = JavaLanguageVersion.of(17) }
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
} else {
    java {
        sourceCompatibility = JavaVersion.toVersion('25')
        targetCompatibility = JavaVersion.toVersion('25')
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://nexus.bertramlabs.com/content/repositories/releases" }
    maven { url "https://nexus.bertramlabs.com/content/repositories/publicReleases" }
}

configurations {
    provided
    // plugin-api 1.5.0 still declares Groovy 3 (org.codehaus.groovy) while the build uses Groovy 4
    // (org.apache.groovy): both claim the same capability. Pick the newer one, as HPE's 9.1 plugins do.
    configureEach {
        resolutionStrategy.capabilitiesResolution.all {
            selectHighestVersion()
        }
    }
}

sourceSets {
    main {
        compileClasspath += configurations.provided
    }
}

dependencies {
    provided "com.morpheusdata:morpheus-plugin-api:$targetApiVersion"
    if (for90) {
        provided "org.codehaus.groovy:groovy:$groovy90Version"
        provided "org.codehaus.groovy:groovy-json:$groovy90Version"
    } else {
        provided "org.apache.groovy:groovy-all:$groovyVersion"
    }
    implementation "org.slf4j:slf4j-api:$slf4jVersion"
}

jar {
    manifest {
        attributes(
            'Plugin-Class': 'com.morpheusdata.gfs2rescue.Gfs2RescuePlugin',
            'Plugin-Version': version,
            'Morpheus-Name': 'GFS2 Rescue',
            'Morpheus-Organization': 'Travis DeLuca',
            'Morpheus-Code': 'gfs2-rescue',
            'Morpheus-Description': 'Take over GFS2 shared storage left behind by a cluster that is gone: inspect, check, repair, adopt, verify',
            'Morpheus-Labels': 'Plugin, Storage, Infrastructure',
            'Morpheus-Repo': 'https://github.com/builtbyfood/gfs2-rescue',
            'Morpheus-Min-Appliance-Version': targetMinVersion
        )
    }
}

assets {
    packagePlugin = false
}

// 9.1: morpheus-gfs2-rescue-<version>-all.jar (unchanged); 9.0: morpheus-gfs2-rescue-<version>-9.0-all.jar
if (for90) {
    tasks.named('shadowJar') { archiveClassifier.set('9.0-all') }
}

tasks.assemble.dependsOn tasks.shadowJar

// Build (Java 25 + Gradle 9.x, same as HPE's 9.1 plugins):
//   sdk use java 25-tem ; sdk use gradle 9.1.0
//   gradle clean shadowJar --no-daemon
// Output: build/libs/morpheus-gfs2-rescue-<version>-all.jar
// Morpheus 9.0.x:
//   gradle clean shadowJar -PmorpheusTarget=9.0 --no-daemon
// Output: build-9.0/libs/morpheus-gfs2-rescue-<version>-9.0-all.jar
